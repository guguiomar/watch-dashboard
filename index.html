<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G Watch Radar — Edição 01</title>
  <meta name="description" content="Preços, sinais e onde comprar vinte referências de relógios.">
  <link rel="stylesheet" href="css/radar.css">
  <link rel="preload" as="image" href="img/126610LN.webp" type="image/webp">
  <link rel="preload" as="image" href="img/126710BLRO.webp" type="image/webp">
  <link rel="preload" as="image" href="img/126500LN-0001.webp" type="image/webp">
  <link rel="preload" as="image" href="img/126334.webp" type="image/webp">
  <link rel="preload" as="image" href="img/310.30.42.50.01.001.webp" type="image/webp">
  <link rel="preload" as="image" href="img/210.30.42.20.01.001.webp" type="image/webp">
  <link rel="preload" as="image" href="img/220.10.41.21.01.001.webp" type="image/webp">
  <link rel="preload" as="image" href="img/WSSA0029.webp" type="image/webp">
  <link rel="preload" as="image" href="img/WSSA0018.webp" type="image/webp">
  <link rel="preload" as="image" href="img/WSBB0062.webp" type="image/webp">
  <link rel="preload" as="image" href="img/PAM01314.webp" type="image/webp">
  <link rel="preload" as="image" href="img/279174.webp" type="image/webp">
  <link rel="preload" as="image" href="img/278274.webp" type="image/webp">
  <link rel="preload" as="image" href="img/131.10.29.20.55.001.webp" type="image/webp">
  <link rel="preload" as="image" href="img/220.10.34.20.01.001.webp" type="image/webp">
  <link rel="preload" as="image" href="img/WSPN0013.webp" type="image/webp">
  <link rel="preload" as="image" href="img/WSSA0082.webp" type="image/webp">
  <link rel="preload" as="image" href="img/WSTA0129.webp" type="image/webp">
  <link rel="preload" as="image" href="img/PAM01123.webp" type="image/webp">
</head>
<body>
  <div class="spine" aria-hidden="true"></div>

  <header class="mast">
    <div class="folio">
      <span>Porto</span>
      <span>Edição 01 · Novembro 2026</span>
    </div>
    <div class="mast-row">
      <h1><span class="g-mark">G</span> Watch <em>Radar</em></h1>
      <nav class="mast-nav" aria-label="Secções">
        <a href="#modelos">Modelos</a>
        <a href="#mercado">Mercado</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="modelos" class="sec">
      <div class="sec-head">
        <p class="kicker">Modelos</p>
        <p class="count" id="count"></p>
      </div>
      <form class="filters" id="filters" aria-label="Filtros">
        <label>Marca
          <select name="brand" id="f-brand">
            <option value="">Todas</option>
          </select>
        </label>
        <label>Uso
          <select name="gender" id="f-gender">
            <option value="">Todos</option>
            <option value="homem">Homem</option>
            <option value="mulher">Senhora</option>
          </select>
        </label>
        <label>Sinal
          <select name="signal" id="f-signal">
            <option value="">Todos</option>
            <option value="abaixo do retalho">Abaixo do retalho</option>
            <option value="perto">Perto</option>
            <option value="prémio">Prémio</option>
          </select>
        </label>
        <label>Ordenar
          <select name="sort" id="f-sort">
            <option value="brand">Marca</option>
            <option value="price">Preço de mercado</option>
            <option value="premium">Prémio</option>
          </select>
        </label>
      </form>
      <div class="grid" id="grid"></div>
    </section>

    <section id="mercado" class="sec">
      <div class="sec-head">
        <p class="kicker">Mercado</p>
      </div>
      <div class="snapshots" id="snapshots"></div>
      <div class="chart-grid">
        <figure class="chart-fig">
          <h2 class="chart-title">Prémio médio vs retalho PT</h2>
          <div class="chart-wrap"><canvas id="chart-premium"></canvas></div>
          <p class="chart-source" id="cap-premium"></p>
        </figure>
        <figure class="chart-fig">
          <h2 class="chart-title">Preço mediano de mercado</h2>
          <div class="chart-wrap"><canvas id="chart-median"></canvas></div>
          <p class="chart-source" id="cap-median"></p>
        </figure>
        <figure class="chart-fig">
          <h2 class="chart-title">Vendas a 1 ano</h2>
          <div class="chart-wrap"><canvas id="chart-sales"></canvas></div>
          <p class="chart-source" id="cap-sales"></p>
        </figure>
        <figure class="chart-fig">
          <h2 class="chart-title">Índice anual WatchCharts</h2>
          <div class="chart-wrap"><canvas id="chart-yearly"></canvas></div>
          <p class="chart-source" id="cap-yearly"></p>
        </figure>
      </div>
      <figure class="chart-fig chart-wide">
        <h2 class="chart-title">Modelos por prémio vs retalho PT</h2>
        <div class="chart-wrap chart-wrap-tall"><canvas id="chart-rank"></canvas></div>
        <p class="chart-source" id="cap-rank"></p>
      </figure>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <button class="drawer-close" id="drawer-close" type="button" aria-label="Fechar">Fechar</button>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="js/chart.umd.min.js"></script>
  <script src="js/radar.js"></script>
</body>
</html>
