<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G Watch Radar</title>
  <meta name="description" content="Preços de mercado com fonte, onde comprar e tendência histórica de relógios.">
  <link rel="stylesheet" href="css/radar.css">
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <a class="wordmark" href="#/" id="wordmark">G Watch <em>Radar</em></a>
      <p class="header-meta" id="updated-line">A carregar…</p>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="cat-nav" aria-label="Menu">Menu</button>
    </div>
    <nav class="cat-nav" id="cat-nav" aria-label="Categorias">
      <div class="cat-group" role="list">
        <a href="#/" data-filter="brand" data-value="Rolex">Rolex</a>
        <a href="#/" data-filter="brand" data-value="Omega">Omega</a>
        <a href="#/" data-filter="brand" data-value="Cartier">Cartier</a>
        <a href="#/" data-filter="brand" data-value="Panerai">Panerai</a>
      </div>
      <div class="cat-group" role="list">
        <a href="#/" data-filter="gender" data-value="homem">Homem</a>
        <a href="#/" data-filter="gender" data-value="mulher">Senhora</a>
      </div>
      <div class="cat-group cat-dest" role="list">
        <a href="#/oportunidades">Oportunidades</a>
        <a href="#/tendencias">Tendências</a>
      </div>
    </nav>
  </header>

  <div id="view-listing" class="view shop-view">
    <aside class="filter-col">
      <form class="filters" id="filters" aria-label="Filtros">
        <div class="filter-head">
          <p class="filter-title">Filtros</p>
          <button type="button" class="filters-close" id="filters-close">Fechar</button>
        </div>
        <label>Procurar
          <input type="search" name="q" id="f-search" placeholder="Marca, modelo, referência" autocomplete="off" spellcheck="false">
        </label>
        <label>Marca
          <select name="brand" id="f-brand">
            <option value="">Todas</option>
          </select>
        </label>
        <label>Uso
          <select name="gender" id="f-gender">
            <option value="">Todos</option>
            <option value="homem">Homem</option>
            <option value="mulher">Senhora</option>
          </select>
        </label>
        <label>Tamanho
          <select name="size" id="f-size">
            <option value="">Todos</option>
          </select>
        </label>
        <label>Preço de mercado
          <select name="price" id="f-price">
            <option value="">Todos</option>
            <option value="0-5000">Até 5 000 €</option>
            <option value="5000-10000">5 000–10 000 €</option>
            <option value="10000-20000">10 000–20 000 €</option>
            <option value="20000-">Mais de 20 000 €</option>
          </select>
        </label>
        <label>Sinal
          <select name="signal" id="f-signal">
            <option value="">Todos</option>
            <option value="abaixo do retalho">Abaixo do retalho</option>
            <option value="perto">Perto</option>
            <option value="prémio">Prémio</option>
          </select>
        </label>
        <label>Pulseira
          <select name="bracelet" id="f-bracelet">
            <option value="">Todas</option>
            <option value="Oyster">Oyster</option>
            <option value="Jubilee">Jubilee</option>
            <option value="President">President</option>
            <option value="Oysterflex">Oysterflex</option>
          </select>
        </label>
        <button type="button" class="filters-clear" id="filters-clear">Limpar</button>
      </form>
    </aside>

    <section class="listing" id="modelos" aria-label="Modelos">
      <div class="listing-bar">
        <div>
          <h1 class="listing-title">Relógios</h1>
          <p class="count" id="count"></p>
        </div>
        <div class="listing-actions">
          <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters">Filtros</button>
          <label class="sort-field">
            <span class="sort-label">Ordenar</span>
            <select name="sort" id="f-sort" aria-label="Ordenar">
              <option value="brand">Marca</option>
              <option value="price">Preço</option>
              <option value="premium">Prémio</option>
            </select>
          </label>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </div>

  <div id="view-pdp" class="view pdp-view" hidden></div>

  <div id="view-oportunidades" class="view editorial-view" hidden>
    <section id="oportunidades" class="sec">
      <header class="sec-head">
        <p class="eyebrow">Oportunidades</p>
        <h1>Comprar agora?</h1>
      </header>
      <div id="deals"></div>
    </section>
  </div>

  <div id="view-tendencias" class="view editorial-view" hidden>
    <section id="tendencias" class="sec">
      <header class="sec-head">
        <p class="eyebrow">Tendências</p>
        <h1>O que se está a falar</h1>
      </header>
      <div id="trends"></div>
    </section>
    <section id="mercado" class="sec">
      <header class="sec-head">
        <p class="eyebrow">Mercado</p>
        <h2 class="sec-title">Números com fonte</h2>
      </header>
      <div class="outliers" id="outliers" hidden></div>
      <div class="snapshots" id="snapshots"></div>
      <figure class="chart-fig chart-wide">
        <h2 class="chart-title">Tendência de preços (pontos reais)</h2>
        <div class="chart-wrap chart-wrap-trend"><canvas id="chart-trend"></canvas></div>
        <p class="chart-source" id="cap-trend"></p>
      </figure>
      <div class="chart-grid">
        <figure class="chart-fig">
          <h2 class="chart-title">Prémio médio vs retalho PT</h2>
          <div class="chart-wrap"><canvas id="chart-premium"></canvas></div>
          <p class="chart-source" id="cap-premium"></p>
        </figure>
        <figure class="chart-fig">
          <h2 class="chart-title">Preço mediano de mercado</h2>
          <div class="chart-wrap"><canvas id="chart-median"></canvas></div>
          <p class="chart-source" id="cap-median"></p>
        </figure>
        <figure class="chart-fig">
          <h2 class="chart-title">Vendas a 1 ano</h2>
          <div class="chart-wrap"><canvas id="chart-sales"></canvas></div>
          <p class="chart-source" id="cap-sales"></p>
        </figure>
        <figure class="chart-fig">
          <h2 class="chart-title">Índice anual WatchCharts</h2>
          <div class="chart-wrap"><canvas id="chart-yearly"></canvas></div>
          <p class="chart-source" id="cap-yearly"></p>
        </figure>
      </div>
      <figure class="chart-fig chart-wide">
        <div class="chart-title-row">
          <h2 class="chart-title">Modelos por prémio vs retalho PT <span class="info-icon" tabindex="0" title="Prémio de mercado (WatchCharts) face ao retalho PT. Referências sem PVP PT omitidas.">ⓘ</span></h2>
          <button type="button" class="rank-toggle" id="rank-toggle" hidden>Ver todos</button>
        </div>
        <div class="chart-wrap chart-wrap-tall"><canvas id="chart-rank"></canvas></div>
        <p class="chart-source" id="cap-rank"></p>
      </figure>
    </section>
  </div>

  <footer class="foot" id="foot"></footer>

  <div class="scrim" id="scrim" hidden></div>
  <div class="scrim" id="filter-scrim" hidden></div>

  <script src="js/chart.umd.min.js"></script>
  <script src="js/radar.js"></script>
</body>
</html>
